<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOVA V2Ray</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#0b1020;color:white;font-family:Arial,sans-serif}
.container{max-width:650px;margin:auto}
.card{background:#121b30;border:1px solid #263650;border-radius:16px;padding:20px;margin-bottom:18px}
h1{color:#54e6c1;text-align:center}
label{display:block;margin:15px 0 7px}
input,select{width:100%;padding:13px;border-radius:9px;border:1px solid #344563;background:#0b1020;color:white;font-size:16px}
button{border:0;border-radius:9px;padding:12px 16px;margin:5px 3px;cursor:pointer;font-size:15px;background:#54e6c1;color:#07121d}
.secondary{background:#263650;color:white}
.danger{background:#b93248;color:white}
.output{display:none;white-space:pre-wrap;overflow-wrap:anywhere;line-height:2;background:#0b1020;padding:14px;border-radius:10px;margin-top:15px}
.output.show{display:block}
.user{padding:12px;margin-top:10px;border:1px solid #263650;border-radius:10px;overflow-wrap:anywhere;line-height:2}
small{color:#a9bad1;line-height:2}
</style>
</head>
<body>
<main class="container">
<section class="card">
<h1>NOVA V2Ray</h1>
<p style="text-align:center">مدیریت نمایشی کاربران</p>
<p>تعداد کاربران ذخیره‌شده: <strong id="profileCount">۰</strong></p>
</section>

<section class="card">
<h2 id="formTitle">ساخت پروفایل کاربر</h2>
<form id="profileForm">
<label for="username">نام کاربر</label>
<input id="username" type="text" placeholder="مثلاً Aminkn05" required>

<label for="duration">مدت اعتبار (روز)</label>
<input id="duration" type="number" min="1" value="30" required>

<label for="plan">نوع پروفایل</label>
<select id="plan">
<option value="معمولی">معمولی</option>
<option value="ویژه">ویژه</option>
<option value="VIP">VIP</option>
</select>

<button type="submit" id="submitButton">ذخیره کاربر</button>
<button type="button" id="cancelEdit" class="secondary" hidden>لغو ویرایش</button>
<button type="reset" class="secondary">پاک کردن فرم</button>
</form>
<div id="output" class="output"></div>
<button id="copyButton" hidden>کپی اطلاعات</button>
</section>

<section class="card">
<h2>کاربران ذخیره‌شده</h2>
<div id="savedProfiles"></div>
</section>

<section class="card">
<small>این نسخه آزمایشی است. اطلاعات فقط در مرورگر همین دستگاه ذخیره می‌شود. این پنل به سرور واقعی V2Ray متصل نیست و پروفایل اتصال واقعی تولید نمی‌کند.</small>
</section>
</main>

<script>
"use strict";

const form=document.getElementById("profileForm");
const output=document.getElementById("output");
const countElement=document.getElementById("profileCount");
const copyButton=document.getElementById("copyButton");
const savedProfiles=document.getElementById("savedProfiles");
const usernameInput=document.getElementById("username");
const durationInput=document.getElementById("duration");
const planInput=document.getElementById("plan");
const formTitle=document.getElementById("formTitle");
const submitButton=document.getElementById("submitButton");
const cancelEditButton=document.getElementById("cancelEdit");
const STORAGE_KEY="nova_saved_profiles";

let latestProfile="";
let editingId=null;

function getProfiles(){
  try{
    const data=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");
    if(!Array.isArray(data))return [];
    return data.map((profile,index)=>({
      ...profile,
      id:profile.id||("nova-"+index+"-"+String(profile.username||"user"))
    }));
  }catch{
    return [];
  }
}

function saveProfiles(profiles){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(profiles));
    return true;
  }catch{
    alert("ذخیره انجام نشد؛ فضای ذخیره‌سازی مرورگر را بررسی کن.");
    return false;
  }
}

function updateCount(){
  countElement.textContent=new Intl.NumberFormat("fa-IR").format(getProfiles().length);
}

function resetEditMode(){
  editingId=null;
  formTitle.textContent="ساخت پروفایل کاربر";
  submitButton.textContent="ذخیره کاربر";
  cancelEditButton.hidden=true;
}

function showProfiles(){
  savedProfiles.replaceChildren();
  const profiles=getProfiles();

  if(profiles.length===0){
    const message=document.createElement("p");
    message.textContent="هنوز کاربری ذخیره نشده است.";
    savedProfiles.appendChild(message);
    updateCount();
    return;
  }

  profiles.forEach(function(profile){
    const item=document.createElement("div");
    item.className="user";

    const details=document.createElement("p");
    details.textContent="نام کاربر: "+profile.username+
      " | اعتبار نمایشی: "+profile.duration+
      " روز | نوع: "+profile.plan+" | وضعیت: آزمایشی";

    const editButton=document.createElement("button");
    editButton.type="button";
    editButton.textContent="ویرایش کاربر";

    editButton.addEventListener("click",function(){
      usernameInput.value=profile.username;
      durationInput.value=profile.duration;
      planInput.value=profile.plan;
      editingId=profile.id;
      formTitle.textContent="ویرایش پروفایل کاربر";
      submitButton.textContent="ذخیره تغییرات";
      cancelEditButton.hidden=false;
      form.scrollIntoView({behavior:"smooth",block:"start"});
    });

    const removeButton=document.createElement("button");
    removeButton.className="danger";
    removeButton.type="button";
    removeButton.textContent="حذف کاربر";

    removeButton.addEventListener("click",function(){
      if(!confirm("این کاربر حذف شود؟"))return;
      const updated=getProfiles().filter(p=>p.id!==profile.id);
      if(saveProfiles(updated)){
        if(editingId===profile.id){
          form.reset();
          resetEditMode();
        }
        updateCount();
        showProfiles();
      }
    });

    item.append(details,editButton,removeButton);
    savedProfiles.appendChild(item);
  });

  updateCount();
}

form.addEventListener("submit",function(event){
  event.preventDefault();

  const username=usernameInput.value.trim();
  const duration=Number(durationInput.value);
  const plan=planInput.value;

  if(!username){
    alert("نام کاربر را وارد کن.");
    return;
  }

  if(!Number.isInteger(duration)||duration<=0){
    alert("مدت اعتبار معتبر نیست.");
    return;
  }

  const profiles=getProfiles();

  if(editingId!==null){
    const index=profiles.findIndex(p=>p.id===editingId);
    if(index===-1){
      alert("کاربر پیدا نشد؛ فهرست را بررسی کن.");
      resetEditMode();
      showProfiles();
      return;
    }

    profiles[index]={...profiles[index],username,duration,plan};
  }else{
    profiles.push({
      id:"nova-"+Date.now()+"-"+Math.random().toString(36).slice(2),
      username,
      duration,
      plan
    });
  }

  if(!saveProfiles(profiles))return;

  latestProfile="نام کاربر: "+username+
    "\nمدت اعتبار نمایشی: "+duration+
    " روز\nنوع پروفایل: "+plan+"\nوضعیت: آزمایشی";

  output.textContent=latestProfile;
  output.classList.add("show");
  copyButton.hidden=false;

  form.reset();
  resetEditMode();
  updateCount();
  showProfiles();

  alert("اطلاعات در همین مرورگر ذخیره شد.");
});

cancelEditButton.addEventListener("click",function(){
  form.reset();
  resetEditMode();
});

form.addEventListener("reset",function(){
  output.textContent="";
  output.classList.remove("show");
  copyButton.hidden=true;
  latestProfile="";
});

copyButton.addEventListener("click",async function(){
  if(!latestProfile)return;
  try{
    await navigator.clipboard.writeText(latestProfile);
    alert("اطلاعات کپی شد.");
  }catch{
    alert("کپی خودکار انجام نشد؛ اطلاعات را دستی کپی کن.");
  }
});

showProfiles();
</script>
</body>
</html>
